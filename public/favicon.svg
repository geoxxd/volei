<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#E58000"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro circular para contraste perfeito em abas claras ou escuras -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />
  
  <!-- Setas circulares dinâmicas ao redor (Símbolo do Código da Areia) -->
  <!-- Seta Superior -->
  <path d="M 380,105 C 295,45 175,55 115,108 C 75,145 55,200 60,250 C 68,198 100,148 152,118 C 205,88 308,82 388,128 Z" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="6" />
  <path d="M 370,72 L 420,132 L 348,142 Z" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />

  <!-- Seta Inferior -->
  <path d="M 132,407 C 217,467 337,457 397,404 C 437,367 457,312 452,262 C 444,314 412,364 360,394 C 307,424 204,430 124,384 Z" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="6" />
  <path d="M 142,440 L 92,380 L 164,370 Z" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />

  <!-- Bola de Vôlei Central -->
  <g transform="translate(256, 256)">
    <!-- Base Branca da Bola -->
    <circle cx="0" cy="0" r="140" fill="#FFFFFF" stroke="#0F172A" stroke-width="12" />
    
    <!-- Painéis Amarelos / Dourados de Vôlei de Praia -->
    <path d="M -135,-35 C -75,-105 5,-135 70,-120 C 20,-85 -35,-35 -65,30 C -105,-10 -125,-20 -135,-35 Z" fill="url(#goldGrad)" />
    <path d="M 135,35 C 75,105 -5,135 -70,120 C -20,85 35,35 65,-30 C 105,10 125,20 135,35 Z" fill="url(#goldGrad)" />
    
    <!-- Costuras pretas curvas da bola de vôlei -->
    <path d="M -138,-25 C -65,-110 50,-125 118,-75" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <path d="M -110,-75 C -25,-135 80,-95 135,-25" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />

    <path d="M -140,0 C -45,-75 45,75 140,0" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <path d="M -75,115 C 30,135 110,75 138,25" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <path d="M -135,25 C -75,95 30,135 110,75" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />

    <path d="M -25,-135 C 40,-35 75,60 25,135" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <path d="M -65,-120 C -15,-25 25,65 -25,120" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
