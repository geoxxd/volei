<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Escuro Preto Gradiente -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Painéis Dourados com Brilho de Vôlei de Praia -->
    <linearGradient id="goldPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE00"/>
      <stop offset="40%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#D97700"/>
    </linearGradient>

    <!-- Painéis Brancos com Brilho 3D -->
    <linearGradient id="whitePanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Fundo Preto do Ícone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Bola de Vôlei de Praia Dourada e Branca (Fundo Preto) -->
  <g transform="translate(256, 256)">
    <!-- Base Circular -->
    <circle cx="0" cy="0" r="222" fill="#000000" stroke="#000000" stroke-width="14"/>

    <!-- 1. GOMOS DOURADOS DE TRÁS E SUPERIORES -->
    <!-- Topo Dourado -->
    <path d="M -125,-182 C -25,-232 108,-205 182,-132 C 122,-175 5,-190 -92,-152 Z" fill="url(#goldPanel)"/>
    <path d="M -125,-182 C -25,-232 108,-205 182,-132 C 138,-82 85,-40 32,-18 C -42,-92 -92,-135 -125,-182 Z" fill="url(#goldPanel)"/>
    <path d="M 52,-212 C 135,-175 208,-92 222,2 C 165,-82 92,-145 10,-192 C 26,-202 39,-208 52,-212 Z" fill="url(#goldPanel)"/>

    <!-- Esquerda Dourada -->
    <path d="M -222,0 C -222,-92 -165,-165 -88,-202 C -42,-135 10,-52 -20,62 C -122,42 -195,-20 -222,0 Z" fill="url(#goldPanel)"/>
    <path d="M -222,0 C -195,102 -112,185 -10,215 C -42,112 -20,20 -88,-202 C -155,-122 -205,-52 -222,0 Z" fill="url(#goldPanel)"/>

    <!-- Inferior Dourado -->
    <path d="M 10,215 C 112,220 195,155 222,52 C 135,112 30,122 -20,62 C -10,122 0,175 10,215 Z" fill="url(#goldPanel)"/>

    <!-- 2. FAIXAS E ARCOS BRANCOS SHINY (Swooshes dinâmicos em relevo) -->
    <!-- Arco Branco 1 -->
    <path d="M -132,-175 C -42,-82 20,42 52,202 C 10,145 -20,72 -78,-20 C -108,-62 -122,-112 -132,-175 Z" fill="url(#whitePanel)"/>

    <!-- Arco Branco Central Principal -->
    <path d="M -188,-112 C -82,-195 72,-205 175,-132 C 72,-112 -20,-30 25,112 C -25,52 -62,-20 -188,-112 Z" fill="url(#whitePanel)"/>

    <!-- Arco Branco Inferior Direito -->
    <path d="M 25,112 C 82,132 155,102 215,30 C 185,-30 112,-92 30,-20 C 52,30 42,82 25,112 Z" fill="url(#whitePanel)"/>
    <path d="M -20,62 C 30,122 132,122 215,72 C 152,155 62,195 -20,62 Z" fill="url(#whitePanel)"/>

    <!-- 3. COSTURAS E CONTORNOS PRETO INTENSO DE ALTA DEFINIÇÃO -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#000000" stroke-width="18"/>
    
    <path d="M -132,-175 C -30,-228 102,-205 175,-132" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M -188,-112 C -82,-195 72,-205 175,-132" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M -88,-202 C 20,-52 -30,112 -10,215" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M -222,0 C -122,42 10,-52 88,-202" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M 30,-20 C 112,-92 185,-30 215,30" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M -20,62 C 30,122 132,122 215,72" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M -10,215 C 82,185 165,145 222,52" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
