<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="50%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#E57C00"/>
    </linearGradient>
  </defs>

  <!-- Bola de Vôlei de Praia Gigante (Preenche 95% do espaço para máxima visibilidade) -->
  <g>
    <!-- Base Circular Branca -->
    <circle cx="256" cy="256" r="236" fill="#FFFFFF" stroke="#0F172A" stroke-width="22" />

    <!-- Faixas e Gomos Amarelos/Dourados de Vôlei de Praia -->
    <path d="M 38,200 C 70,110 150,50 256,42 C 340,36 410,80 448,140 C 370,60 230,60 145,130 C 80,185 55,270 70,350 C 48,305 35,252 38,200 Z" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="14" />
    <path d="M 474,312 C 442,402 362,462 256,470 C 172,476 102,432 64,372 C 142,452 282,452 367,382 C 432,327 457,242 442,162 C 464,207 477,260 474,312 Z" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="14" />

    <!-- Painéis do Centro da Bola -->
    <path d="M 120,256 C 180,180 332,180 392,256 C 332,332 180,332 120,256 Z" fill="url(#goldGrad)" opacity="0.15" />

    <!-- Linhas e Costuras Pretas Cospícuas do Vôlei -->
    <path d="M 42,200 C 130,70 330,50 448,140" fill="none" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
    <path d="M 85,110 C 190,30 385,80 460,200" fill="none" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />

    <path d="M 22,256 C 150,110 362,402 490,256" fill="none" stroke="#0F172A" stroke-width="22" stroke-linecap="round" />
    <path d="M 64,372 C 182,462 382,442 470,312" fill="none" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
    <path d="M 52,312 C 127,432 322,482 427,402" fill="none" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />

    <path d="M 180,45 C 290,175 330,337 270,467" fill="none" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
    <path d="M 115,75 C 225,205 265,337 205,437" fill="none" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
